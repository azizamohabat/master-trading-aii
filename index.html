<!doctype html>

<style>
:root{--bg:#05070f;--surface:#0d1224;--surface2:#131a33;--border:#232c4d;--accent:#f2b807;--green:#22c55e;--red:#ef4444;--text:#e7ebff;--muted:#93a0c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
button,a,input,select,textarea{font:inherit}button,a{touch-action:manipulation}a{color:inherit;text-decoration:none}button{cursor:pointer}
.container{max-width:1200px;margin:auto;padding:0 18px}.nav{position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);background:rgba(5,7,15,.95);backdrop-filter:blur(12px)}
.navin{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{display:flex;align-items:center;gap:9px;font-weight:900;white-space:nowrap}.logo b{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--accent);color:#000}.logo span span{color:var(--accent)}
.links{display:flex;gap:22px;color:var(--muted);font-size:14px;font-weight:700}.links a:hover,.links a.active{color:var(--accent)}.actions{display:flex;gap:8px;align-items:center}.btn{border-radius:10px;padding:11px 15px;font-weight:800;background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--border)}.btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}.btn.green{background:var(--green);color:#031008}.btn.danger{background:rgba(239,68,68,.12);color:#ff8f8f;border-color:rgba(239,68,68,.3)}
.menu{display:none;width:42px;height:42px;border:1px solid var(--border);background:transparent;color:#fff;border-radius:10px;font-size:21px}.mobileNav{display:none;border-top:1px solid var(--border);padding:10px 18px 16px}.mobileNav.open{display:block}.mobileNav a,.mobileNav button{display:block;width:100%;padding:12px;border-radius:9px;background:transparent;color:#fff;text-align:left;margin-top:3px}
.hero{position:relative;padding:80px 0 45px;background:radial-gradient(circle at 20% 0,rgba(242,184,7,.16),transparent 42%),radial-gradient(circle at 85% 0,rgba(34,197,94,.1),transparent 38%)}.badge{display:inline-block;border:1px solid var(--border);background:rgba(255,255,255,.04);padding:7px 11px;border-radius:999px;color:var(--accent);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
h1{font-size:clamp(36px,6vw,64px);line-height:1.04;margin:20px 0 0;max-width:850px}h2{font-size:30px;margin:0 0 18px}h3{margin:0 0 7px}.accent{color:var(--accent)}.muted{color:var(--muted)}.small{font-size:12px}.hero p{max-width:720px;font-size:18px;line-height:1.7;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}section{padding:55px 0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px}.card:hover{border-color:rgba(242,184,7,.45)}.stat{text-align:center;padding:18px}.stat strong{display:block;font-size:27px}.stat span{font-size:11px;color:var(--muted)}.feature .ico{font-size:30px}.feature p{color:var(--muted);font-size:14px;line-height:1.6}
.price{display:flex;flex-direction:column;height:100%}.price.pop{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.price .cost{font-size:40px;font-weight:900;margin:14px 0}.price ul{padding:0;list-style:none;flex:1;color:var(--muted);font-size:14px;line-height:2}.price li::before{content:"✓";color:var(--green);font-weight:900;margin-right:8px}
.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--muted);font-size:11px;font-weight:800}.search{width:100%;background:var(--surface);border:1px solid var(--border);color:#fff;border-radius:11px;padding:13px 14px;outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:var(--accent)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
select,input,textarea{background:var(--surface);border:1px solid var(--border);color:#fff;border-radius:10px;padding:11px;outline:none}.strategyCard{display:flex;flex-direction:column;gap:10px}.strategyCard p{color:var(--muted);font-size:13px;line-height:1.55}.locked{opacity:.72}.lock{color:var(--accent);font-weight:900}
.dashboard{display:grid;grid-template-columns:250px 1fr;gap:20px;padding-top:25px}.sidebar{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;height:max-content;position:sticky;top:84px}.sidebtn{display:flex;width:100%;align-items:center;gap:9px;text-align:left;background:transparent;color:var(--muted);padding:11px;border-radius:9px;margin:2px 0}.sidebtn:hover,.sidebtn.active{background:var(--accent);color:#000;font-weight:900}
.kpi{font-size:28px;font-weight:900}.kpiLabel{font-size:12px;color:var(--muted)}.notice{padding:13px 15px;border-radius:11px;background:rgba(242,184,7,.08);border:1px solid rgba(242,184,7,.25);color:#e9d68a}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px;border-bottom:1px solid var(--border);text-align:left}.table th{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:200;padding:18px}.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px}.hidden{display:none!important}.center{text-align:center}.footer{border-top:1px solid var(--border);padding:35px 0;color:var(--muted);font-size:12px} .progress{height:9px;background:#1a213a;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}
#toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#000;padding:12px 16px;border-radius:10px;font-weight:800;z-index:300;box-shadow:0 12px 40px #0008}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.links,.actions{display:none}.menu{display:block}.dashboard{grid-template-columns:1fr}.sidebar{position:fixed;z-index:150;left:0;top:0;bottom:0;width:285px;border-radius:0;transform:translateX(-105%);transition:.2s;overflow:auto}.sidebar.open{transform:translateX(0)}}
@media(max-width:600px){.container{padding:0 14px}.hero{padding-top:55px}.g2,.g3,.g4{grid-template-columns:1fr}h2{font-size:25px}.card{padding:16px}.hero p{font-size:16px}.navin{height:58px}}
</style></head>

<script>
const STRATEGIES=[{"number": 1, "title": "Pin Bar Reversal", "category": "Price Action", "difficulty": "Beginner", "timeframe": "4H – Daily", "indicators": ["Price Action", "Key Levels"], "marketConditions": "Ranging or trending markets approaching a key level", "coreIdea": "A pin bar (long wick, small body) signals rejection of a price level and a potential reversal.", "entryIdea": "enter in the direction of the rejection once the pin bar candle closes, on a break of its body high/low", "confirmationIdea": "the pin bar forms at a significant support/resistance zone and the wick is at least twice the size of the body", "stopIdea": "beyond the tip of the pin bar's wick", "targetIdea": "the next significant support/resistance level or a fixed risk/reward multiple such as 2R", "mistake1": "trading pin bars that form in the middle of a range with no nearby key level", "mistake2": "entering before the candle actually closes", "isFreePreview": true}, {"number": 2, "title": "Inside Bar Breakout", "category": "Price Action", "difficulty": "Beginner", "timeframe": "1H – Daily", "indicators": ["Price Action"], "marketConditions": "Consolidation after a strong directional move", "coreIdea": "An inside bar (a candle fully contained within the previous candle's range) reflects a pause that often resolves in the direction of the prior trend.", "entryIdea": "place stop orders above and below the inside bar and let the market choose direction, or trade only in the direction of the higher-timeframe trend", "confirmationIdea": "the inside bar follows a strong impulsive 'mother candle' and forms near a trend continuation zone", "stopIdea": "beyond the opposite side of the inside bar (or the mother candle)", "targetIdea": "measured move equal to the mother candle's range, or the next structural level", "mistake1": "taking inside bars inside a choppy, low-volatility range with no clear trend", "mistake2": "ignoring the size of the mother candle relative to average volatility"}, {"number": 3, "title": "Fakeout Reversal (Stop Hunt Reversal)", "category": "Price Action", "difficulty": "Intermediate", "timeframe": "15M – 4H", "indicators": ["Price Action", "Support/Resistance"], "marketConditions": "Markets with obvious liquidity pools above/below swing highs and lows", "coreIdea": "Price briefly breaks a key level to trigger stop losses, then sharply reverses back inside the range, trapping breakout traders.", "entryIdea": "enter against the false breakout once price closes back inside the prior range", "confirmationIdea": "a fast rejection candle with high volume, closing back inside the range within 1-2 candles of the false break", "stopIdea": "just beyond the extreme of the false breakout wick", "targetIdea": "the opposite side of the range or the most recent swing point", "mistake1": "confusing a genuine breakout with a fakeout before confirmation closes", "mistake2": "using a stop that is too tight relative to the size of the stop-hunt wick"}, {"number": 4, "title": "Three-Bar Reversal Pattern", "category": "Price Action", "difficulty": "Beginner", "timeframe": "1H – Daily", "indicators": ["Price Action"], "marketConditions": "End of an extended trend leg", "coreIdea": "Three consecutive candles — an extension candle, a pause/doji candle, then a strong reversal candle — mark exhaustion of the prior trend.", "entryIdea": "enter on the close of the third (reversal) candle in the new direction", "confirmationIdea": "the middle candle has a small body/range compared to the first candle, showing hesitation", "stopIdea": "beyond the extreme of the pattern's three candles", "targetIdea": "prior swing level or a 1.5–2R target", "mistake1": "acting after only two candles without waiting for the reversal confirmation candle", "mistake2": "trading this pattern against a very strong macro trend without extra confluence"}, {"number": 5, "title": "Break of Structure Retest", "category": "Price Action", "difficulty": "Intermediate", "timeframe": "1H – 4H", "indicators": ["Price Action", "Market Structure"], "marketConditions": "Trending markets transitioning direction", "coreIdea": "After price breaks a significant swing high/low (break of structure), it often returns to retest the broken level as new support/resistance before continuing.", "entryIdea": "enter on the retest of the broken structural level in the direction of the new trend", "confirmationIdea": "a clean impulsive break followed by a controlled, lower-momentum pullback to the level", "stopIdea": "beyond the retest swing point, past the broken structure level", "targetIdea": "the next major swing point in the direction of the break", "mistake1": "entering immediately on the break instead of waiting for the retest", "mistake2": "ignoring that the retest failed and price closed back through the level"}, {"number": 6, "title": "Trendline Bounce", "category": "Trend Following", "difficulty": "Beginner", "timeframe": "1H – Daily", "indicators": ["Trendlines"], "marketConditions": "Clean trending markets with at least 3 touch points", "coreIdea": "Price respects a drawn trendline as dynamic support/resistance and bounces off it repeatedly while the trend remains intact.", "entryIdea": "enter in the trend direction when price touches the trendline and shows a rejection candle", "confirmationIdea": "at least two prior clean touches of the same trendline plus a rejection candle on the third/fourth touch", "stopIdea": "just beyond the trendline on the other side of the touch point", "targetIdea": "prior swing high/low or a trailing exit along the trendline", "mistake1": "drawing trendlines that don't actually respect price wicks/closes consistently", "mistake2": "holding onto a trendline long after it has been decisively broken"}, {"number": 7, "title": "Higher-High Higher-Low Continuation", "category": "Trend Following", "difficulty": "Beginner", "timeframe": "4H – Daily", "indicators": ["Market Structure"], "marketConditions": "Established uptrend or downtrend", "coreIdea": "As long as a market keeps printing higher highs and higher lows (or lower lows/lower highs), the trend is intact and pullbacks are opportunities.", "entryIdea": "buy pullbacks into the most recent higher low (or sell rallies into the most recent lower high)", "confirmationIdea": "the pullback holds above/below the prior swing point and shows a bullish/bearish reaction candle", "stopIdea": "beyond the most recent swing low/high", "targetIdea": "the prior all-time/local swing high (or low) with trailing stops thereafter", "mistake1": "buying a pullback that has already broken the prior swing point, signalling a possible trend change", "mistake2": "not adjusting position size as volatility expands"}, {"number": 8, "title": "Parabolic Trend Exhaustion", "category": "Trend Following", "difficulty": "Advanced", "timeframe": "1H – Daily", "indicators": ["Price Action", "RSI"], "marketConditions": "Vertical, accelerating trend moves (blow-off tops/bottoms)", "coreIdea": "Extremely steep, accelerating trends are unsustainable and typically end in a sharp reversal or consolidation once buyers/sellers are exhausted.", "entryIdea": "reduce or close trend-following positions and look for reversal confirmation once momentum divergence appears", "confirmationIdea": "price makes a new extreme while RSI/momentum fails to make a new extreme (divergence)", "stopIdea": "beyond the most recent parabolic extreme", "targetIdea": "a retracement to the nearest moving average or prior consolidation zone", "mistake1": "trying to short a parabolic move purely because 'it has gone too far' without a confirmation signal", "mistake2": "ignoring that strong trends can stay extended longer than expected"}, {"number": 9, "title": "Donchian Channel Trend Ride", "category": "Trend Following", "difficulty": "Intermediate", "timeframe": "4H – Daily", "indicators": ["Donchian Channel"], "marketConditions": "Markets breaking out of multi-week ranges into sustained trends", "coreIdea": "Entering when price closes outside a 20/55-period Donchian channel captures the start of sustained trending moves (classic turtle-style trend following).", "entryIdea": "enter long on a close above the upper channel band, short on a close below the lower band", "confirmationIdea": "the breakout candle closes with above-average range/volume outside the channel", "stopIdea": "the midpoint of the channel or a fixed ATR multiple from entry", "targetIdea": "trail the stop using the opposite (shorter) Donchian band until stopped out", "mistake1": "taking every channel breakout regardless of higher-timeframe context", "mistake2": "cutting winners early instead of trailing the stop as designed"}, {"number": 10, "title": "Multi-Timeframe Trend Alignment", "category": "Trend Following", "difficulty": "Intermediate", "timeframe": "1H entries in a Daily trend", "indicators": ["Moving Averages", "Market Structure"], "marketConditions": "Trending higher timeframe with a pullback on the lower timeframe", "coreIdea": "Trading only in the direction of the higher-timeframe trend while timing entries on a lower timeframe pullback dramatically improves win rate.", "entryIdea": "identify the daily trend direction, then enter on the 1H chart when it pulls back and resumes in that direction", "confirmationIdea": "the 1H chart prints a new structure break back in the direction of the daily trend", "stopIdea": "beyond the 1H pullback's swing extreme", "targetIdea": "the next daily-timeframe resistance/support zone", "mistake1": "trading counter to the higher timeframe trend for a 'quick scalp'", "mistake2": "using a lower-timeframe stop that is too tight for the higher-timeframe volatility"}, {"number": 11, "title": "Range Breakout", "category": "Breakout", "difficulty": "Beginner", "timeframe": "1H – 4H", "indicators": ["Support/Resistance", "Volume"], "marketConditions": "Extended sideways consolidation", "coreIdea": "When price breaks decisively out of a well-defined horizontal range, it often continues in the breakout direction as trapped participants adjust.", "entryIdea": "enter on a confirmed close beyond the range boundary, ideally with a retest of the broken boundary", "confirmationIdea": "increased volume/momentum on the breakout candle plus a successful retest as new support/resistance", "stopIdea": "back inside the range, beyond the retest point", "targetIdea": "the height of the range projected from the breakout point", "mistake1": "chasing the breakout candle without waiting for a retest", "mistake2": "trading breakouts from very narrow, low-liquidity ranges"}, {"number": 12, "title": "Triangle Breakout", "category": "Breakout", "difficulty": "Intermediate", "timeframe": "4H – Daily", "indicators": ["Trendlines", "Price Action"], "marketConditions": "Converging price action forming ascending/descending/symmetrical triangles", "coreIdea": "Triangles reflect decreasing volatility before an eventual expansion; the breakout direction often continues the dominant trend.", "entryIdea": "enter on a confirmed breakout of the triangle's upper or lower trendline", "confirmationIdea": "the breakout occurs in the direction of the prevailing trend and closes clearly outside the triangle", "stopIdea": "back inside the triangle, beyond the most recent swing point", "targetIdea": "the widest part (base) of the triangle projected from the breakout point", "mistake1": "entering on the first touch of the trendline instead of an actual close beyond it", "mistake2": "ignoring failed breakouts that whipsaw back into the triangle", "isFreePreview": true}, {"number": 13, "title": "Flag and Pennant Continuation", "category": "Breakout", "difficulty": "Beginner", "timeframe": "15M – 4H", "indicators": ["Price Action"], "marketConditions": "Strong impulsive move followed by a tight consolidation flag", "coreIdea": "After a sharp impulsive move (the flagpole), a brief tight consolidation (the flag/pennant) often resolves with continuation in the same direction.", "entryIdea": "enter on a break of the flag's consolidation boundary in the direction of the flagpole", "confirmationIdea": "the flag is shallow (typically less than 50% retracement of the flagpole) and tight in range", "stopIdea": "beyond the opposite side of the flag", "targetIdea": "the length of the flagpole projected from the breakout point", "mistake1": "trading flags that retrace more than 50-60% of the flagpole (often a reversal, not continuation)", "mistake2": "using position sizes calibrated for the flagpole's volatility instead of the tighter flag"}, {"number": 14, "title": "Volatility Contraction Breakout", "category": "Breakout", "difficulty": "Intermediate", "timeframe": "4H – Daily", "indicators": ["Bollinger Bands", "ATR"], "marketConditions": "Bollinger Band squeeze / historically low ATR", "coreIdea": "Periods of unusually low volatility (a 'squeeze') are frequently followed by sharp expansion moves; trading the direction of the initial expansion candle can capture the new trend.", "entryIdea": "enter in the direction of the first strong expansion candle after a prolonged squeeze", "confirmationIdea": "Bollinger Bands are at a multi-week narrow width and ATR is near multi-week lows before the breakout", "stopIdea": "the opposite side of the squeeze range", "targetIdea": "a multiple of the pre-breakout ATR, trailed as the move develops", "mistake1": "anticipating direction before the squeeze actually resolves", "mistake2": "ignoring a failed breakout that snaps back into the squeeze range"}, {"number": 15, "title": "News/Event Volatility Breakout", "category": "Breakout", "difficulty": "Advanced", "timeframe": "1M – 15M", "indicators": ["Price Action", "Volume"], "marketConditions": "Scheduled high-impact news/events creating a volatility spike", "coreIdea": "High-impact news can trigger a sharp directional breakout from the pre-event range; trading the confirmed direction (never the news headline itself) can capture the initial move.", "entryIdea": "enter only after price closes beyond the pre-event range with strong volume, avoiding the first erratic tick", "confirmationIdea": "a clean directional close outside the pre-news range accompanied by a volume spike", "stopIdea": "back inside the pre-event range", "targetIdea": "a conservative 1–1.5R given the elevated volatility and wider spreads", "mistake1": "entering during the initial spike before spreads normalize", "mistake2": "using standard position sizing during abnormally high volatility"}, {"number": 16, "title": "Horizontal Support/Resistance Bounce", "category": "Support/Resistance", "difficulty": "Beginner", "timeframe": "1H – Daily", "indicators": ["Support/Resistance"], "marketConditions": "Ranging markets with clearly tested horizontal levels", "coreIdea": "Price tends to react at levels that have previously acted as turning points, especially when tested multiple times.", "entryIdea": "enter in the direction of the bounce once a rejection candle forms at the level", "confirmationIdea": "the level has at least two prior clean reactions and current price action shows a clear rejection wick", "stopIdea": "just beyond the level, outside the rejection wick", "targetIdea": "the opposite boundary of the range", "mistake1": "trading a level that has already been broken and retested as the opposite role", "mistake2": "ignoring the overall trend context when fading a level"}, {"number": 17, "title": "Support Turned Resistance (Role Reversal)", "category": "Support/Resistance", "difficulty": "Intermediate", "timeframe": "1H – Daily", "indicators": ["Support/Resistance"], "marketConditions": "After a confirmed breakdown/breakout of a key level", "coreIdea": "Once broken, a support level frequently becomes resistance (and vice versa) as market participants reassess the level's significance.", "entryIdea": "enter in the breakout direction on the retest of the flipped level", "confirmationIdea": "a clear rejection at the flipped level on the retest, in the direction of the original break", "stopIdea": "beyond the flipped level, back through the origin of the breakout", "targetIdea": "the next major structural level", "mistake1": "assuming every retest will hold without waiting for rejection confirmation", "mistake2": "using a stop so tight that normal noise around the level triggers it"}, {"number": 18, "title": "Supply and Demand Zone Trading", "category": "Support/Resistance", "difficulty": "Intermediate", "timeframe": "1H – 4H", "indicators": ["Supply/Demand Zones"], "marketConditions": "Markets with clear imbalance zones from strong impulsive moves", "coreIdea": "Zones where price moved away rapidly (leaving an imbalance) tend to attract price back for a 'fill' before continuing, offering a high-probability re-entry.", "entryIdea": "enter when price returns into a fresh, unmitigated supply/demand zone and shows a reaction", "confirmationIdea": "the zone was created by a strong impulsive candle/move and has not been retested before", "stopIdea": "just beyond the far edge of the zone", "targetIdea": "the next opposing zone or structural swing point", "mistake1": "trading zones that have already been tested multiple times (weakened zones)", "mistake2": "drawing zones too wide, reducing risk/reward quality"}, {"number": 19, "title": "Round Number Psychological Level", "category": "Support/Resistance", "difficulty": "Beginner", "timeframe": "1H – Daily", "indicators": ["Support/Resistance"], "marketConditions": "Approach to major round numbers (e.g., 50000, 100, 1.2000)", "coreIdea": "Round numbers attract clustered orders (stop losses, take profits, limit entries) and often act as short-term support/resistance.", "entryIdea": "look for a rejection or a confirmed break-and-retest around the round number before entering", "confirmationIdea": "clear price rejection or high-volume reaction candle right at the round number", "stopIdea": "a small buffer beyond the round number", "targetIdea": "the next round number or nearby structural level", "mistake1": "assuming every round number will hold without any price action confirmation", "mistake2": "placing a stop loss exactly at the round number where liquidity is thickest"}, {"number": 20, "title": "Multi-Touch Zone Confluence", "category": "Support/Resistance", "difficulty": "Intermediate", "timeframe": "4H – Daily", "indicators": ["Support/Resistance", "Moving Averages"], "marketConditions": "Confluence areas combining several independent technical levels", "coreIdea": "When a horizontal level, a moving average, and a trendline all converge in the same price area, reactions tend to be stronger and more reliable.", "entryIdea": "enter when price reaches the confluence zone and prints a clear reaction candle", "confirmationIdea": "at least two independent technical tools (e.g., horizontal level + moving average) align within a tight price band", "stopIdea": "beyond the full confluence zone", "targetIdea": "the next opposing confluence area or a fixed risk/reward multiple", "mistake1": "forcing confluence where levels are actually far apart", "mistake2": "over-weighting confluence and ignoring the broader trend"}, {"number": 21, "title": "Bullish/Bearish Engulfing", "category": "Candlestick", "difficulty": "Beginner", "timeframe": "1H – Daily", "indicators": ["Candlestick Patterns"], "marketConditions": "At the end of a pullback or minor trend", "coreIdea": "An engulfing candle that fully covers the prior candle's body shows a decisive shift in control between buyers and sellers.", "entryIdea": "enter in the direction of the engulfing candle once it closes", "confirmationIdea": "the engulfing candle forms at a key support/resistance level with above-average size", "stopIdea": "beyond the extreme of the engulfing candle", "targetIdea": "the next swing level or a 2R target", "mistake1": "trading engulfing patterns that occur in the middle of a range with no context", "mistake2": "entering before the candle closes"}, {"number": 22, "title": "Morning Star function pricing(){return `<section><div class="container center"><h2>Membership plans</h2><p class="muted">Monthly USDT pricing. Production checkout is confirmed by Binance Pay webhook.</p></div><div class="container grid g3" style="margin-top:25px">${Object.entries(PLANS).map(([id,p])=>`<div class="card price ${p.popular?"pop":""}">${p.popular?'<span class="badge">Most popular</span>':""}<h3 style="margin-top:12px">${p.name}</h3><p class="muted">${p.tagline}</p><div class="cost">$${p.price}<small class="muted">/month</small></div><ul>${p.features.map(f=>`<li>${esc(f)}</li>`).join("")}</ul><button class="btn ${id==="free"?"":"primary"}" onclick="choosePlan('${id}')">${id==="free"?"Start free":"Pay with Binance Pay"}</button></div>`).join("")}</div></section>`}
function choosePlan(id){if(id==="free"){location.hash="signup";return}if(!user){toast("Create an account first");location.hash="signup";return}membership=id;save();toast(`Demo selected ${PLANS[id].name}. Production uses Binance Pay webhook.`);location.hash="dashboard"}
function authPage(signup){return `<section><div class="container" style="max-width:500px"><div class="card"><h2>${signup?"Create account":"Welcome back"}</h2><p class="muted">${signup?"Start with the free plan.":"Log in to your dashboard."}</p>${signup?'<input id="name" placeholder="Full name" style="width:100%;margin:7px 0">':""}<input id="email" type="email" placeholder="Email" style="width:100%;margin:7px 0"><input id="password" type="password" placeholder="Password" style="width:100%;margin:7px 0"><button class="btn primary" style="width:100%;margin-top:8px" onclick="auth(${signup})">${signup?"Create account":"Log in"}</button></div></div></section>`}
function auth(signup){let email=document.getElementById("email").value.trim(),password=document.getElementById("password").value.trim();if(!email||!password)return toast("Enter email and password");user={id:"demo-"+Date.now(),name:signup?(document.getElementById("name").value.trim()||"Trader"):"Trader",email,role:"user"};membership="free";save();toast(signup?"Account created":"Logged in");location.hash="dashboard"}
function logout(){user=null;membership="free";save();location.hash="home";toast("Logged out")}
function sideButtons(){return [["dashboard","🏠 Overview"],["learning","📚 My Strategies / Learning"],["progress","📈 Progress"],["ai","🤖 AI Tutor / Chart Analyzer"],["risk","🧮 Risk Calculator"],["paper","🧪 Paper Trading"],["signals","🎯 Signal Scenarios"],["saved","💾 Saved Analysis"],["profile","👤 Profile"],["pricing","💳 Membership"]].map(x=>`<button class="sidebtn ${route===x[0]?"active":""}" onclick="location.hash='${x[0]}'">${x[1]}</button>`).join("")}
function dashboard(){if(!user)return `<section><div class="container"><div class="card center"><h2>Login required</h2><a class="btn primary" href="#login">Log in</a></div></div></section>`;let done=Object.values(progress).filter(v=>v===100).length;return `<section><div class="container dashboard"><aside class="sidebar" id="side">${sideButtons()}</aside><div><div class="row" style="justify-content:space-between"><div><span class="badge">${esc(PLANS[membership].name)}</span><h2 style="margin-top:12px">Dashboard</h2><p class="muted">Welcome back, ${esc(user.name)}.</p></div><button class="btn" onclick="document.getElementById('side').classList.toggle('open')">☰ Menu</button></div><div class="grid g4"><div class="card"><div class="kpi">${done}</div><div class="kpiLabel">Strategies completed</div></div><div class="card"><div class="kpi">60</div><div class="kpiLabel">Total strategies</div></div><div class="card"><div class="kpi">${trades.length}</div><div class="kpiLabel">Paper trades</div></div><div class="card"><div class="kpi">${PLANS[membership].name}</div><div class="kpiLabel">Membership</div></div></div><div class="grid g2" style="margin-top:18px"><div class="card"><h3>Learning</h3><p class="muted">Continue through strategies and quizzes.</p><a class="btn primary" href="#learning">Open learning</a></div><div class="card"><h3>AI Tools</h3><p class="muted">Tutor, chart analyzer and risk calculator.</p><a class="btn primary" href="#ai">Open AI tools</a></div></div></div></div></section>`}
function learning(){return `<section><div class="container"><h2>My Strategies / Learning</h2><div class="grid g3">${STRATEGIES.map(s=>{let p=progress["s"+s.number]||0;return `<div class="card"><div class="row" style="justify-content:space-between"><b>#${s.number} ${esc(s.title)}</b><span class="tag">${p}%</span></div><div class="progress" style="margin:10px 0"><i style="width:${p}%"></i></div><button class="btn" onclick="openStrategy(${s.number})">Open</button></div>`}).join("")}</div></div></section>`}
function progressPage(){let done=Object.values(progress).filter(v=>v===100).length;return `<section><div class="container"><h2>Progress</h2><div class="card"><div class="kpi">${done} / 60</div><p class="muted">Strategies completed</p><div class="progress"><i style="width:${done/60*100}%"></i></div></div></div></section>`}
function riskPage(){return `<section><div class="container" style="max-width:760px"><h2>Risk Calculator</h2><div class="card"><div class="grid g2"><label>Account equity<input id="equity" type="number" value="1000" style="width:100%"></label><label>Risk %<input id="riskp" type="number" value="1" step=".1" style="width:100%"></label><label>Entry price<input id="entry" type="number" value="100" style="width:100%"></label><label>Stop loss<input id="stop" type="number" value="98" style="width:100%"></label></div><button class="btn primary" style="margin-top:15px" onclick="calcRisk()">Calculate</button><div id="riskout" class="notice hidden" style="margin-top:15px"></div></div></div></section>`}
function calcRisk(){let eq=+document.getElementById("equity").value,r=+document.getElementById("riskp").value,e=+document.getElementById("entry").value,s=+document.getElementById("stop").value,risk=eq*r/100,dist=Math.abs(e-s),size=dist?risk/dist:0,o=document.getElementById("riskout");o.classList.remove("hidden");o.innerHTML=`Max loss: <b>$${risk.toFixed(2)}</b> · Stop distance: <b>${dist.toFixed(4)}</b> · Approx position size: <b>${size.toFixed(4)}</b>`}
function paper(){return `<section><div class="container"><h2>Paper Trading</h2><div class="card"><div class="grid g4"><input id="sym" placeholder="BTC/USDT" value="BTC/USDT"><select id="side"><option>buy</option><option>sell</option></select><input id="pe" type="number" placeholder="Entry"><input id="ps" type="number" placeholder="Size"></div><button class="btn primary" style="margin-top:12px" onclick="addTrade()">Open simulated trade</button></div><div class="card" style="margin-top:18px"><table class="table"><tr><th>Symbol</th><th>Side</th><th>Entry</th><th>Size</th><th>Status</th></tr>${trades.map(t=>`<tr><td>${esc(t.symbol)}</td><td>${t.side}</td><td>${t.entry}</td><td>${t.size}</td><td>${t.status}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">No paper trades yet.</td></tr>'}</table></div></div></section>`}
function addTrade(){let max=planLimit("paperOpen");if(max!==Infinity&&trades.filter(t=>t.status==="open").length>=max){toast(`Free plan allows ${max} open paper trades. Upgrade for unlimited.`);location.hash="pricing";return}let symbol=document.getElementById("sym").value,side=document.getElementById("side").value,entry=+document.getElementById("pe").value,size=+document.getElementById("ps").value;if(!symbol||!entry||!size)return toast("Fill trade fields");trades.push({symbol,side,entry,size,status:"open",createdAt:new Date().toISOString()});save();toast("Paper trade opened");location.hash="paper"}
function signals(){if(!user||!planLimit("signals"))return `<section><div class="container"><div class="card center"><h2>Signal Scenarios</h2><p class="muted">Signal scenarios are included with Pro Trader and Elite Trader.</p><a class="btn primary" href="#pricing">View plans</a></div></div></section>`;return `<section><div class="container"><h2>Signal Scenarios</h2><p class="muted">Educational scenarios only — not financial advice.</p><div class="grid g2">${SIGNALS.map(s=>`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">${s.symbol}</span><span class="tag">${s.bias}</span></div><h3 style="margin-top:10px">${s.title}</h3><p class="muted">Entry: ${s.entry}</p><p class="muted">Stop: ${s.sl}</p><p class="muted">Target: ${s.tp}</p><button class="btn" onclick="saveSignal('${s.title.replaceAll("'","\\'")}')">Save analysis</button></div>`).join("")}</div></div></section>`}
function saveSignal(t){if(!requireFeature("saved","Saved analysis history"))return;if(!saved.includes(t))saved.push(t);save();toast("Saved to Elite analysis history")}
function savedPage(){if(!user||!planLimit("saved"))return `<section><div class="container"><div class="card center"><h2>Saved Analysis History</h2><p class="muted">Saved analysis history is an Elite Trader feature.</p><a class="btn primary" href="#pricing">View plans</a></div></div></section>`;return `<section><div class="container"><h2>Saved Analysis</h2><div class="grid g2">${saved.map(x=>`<div class="card">${esc(x)}</div>`).join("")||'<div class="card muted">Nothing saved yet.</div>'}</div></div></section>`}
function profile(){if(!user)return `<section><div class="container"><div class="card center">Login required.</div></div></section>`;return `<section><div class="container" style="max-width:700px"><h2>Profile</h2><div class="card"><p><b>Name:</b> ${esc(user.name)}</p><p><b>Email:</b> ${esc(user.email)}</p><p><b>Plan:</b> ${esc(PLANS[membership].name)}</p><button class="btn danger" onclick="logout()">Log out</button></div></div></section>`}
function render(){renderNav();let app=document.getElementById("app"),c;if(route==="home")c=home();else if(route==="strategies")c=strategiesPage();else if(route==="ai")c=aiPage();else if(route==="pricing")c=pricing();else if(route==="login")c=authPage(false);else if(route==="signup")c=authPage(true);else if(route==="dashboard")c=dashboard();else if(route==="learning")c=learning();else if(route==="progress")c=progressPage();else if(route==="risk")c=riskPage();else if(route==="paper")c=paper();else if(route==="signals")c=signals();else if(route==="saved")c=savedPage();else if(route==="profile")c=profile();else if(route.startsWith("quiz-"))c=quizPage(+route.split("-")[1]);else c=home();app.innerHTML=c;document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("active",a.dataset.nav===route))}
render();
</script>
<footer class="footer"><div class="container">MASTER TRADING+AI · Educational platform · Not financial advice. Production authentication, AI and Binance Pay must run server-side.</div></footer>
</body></html>
